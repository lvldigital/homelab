app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/umami-software/umami
            tag: postgresql-latest
          env:
            DATABASE_URL: postgresql://umami:umami_password@umami-db:5432/umami
            APP_SECRET: my-super-secret-key-base-umami-12345
            PORT: 3000
    db:
      containers:
        db:
          image:
            repository: docker.io/library/postgres
            tag: 15-alpine
          env:
            POSTGRES_USER: umami
            POSTGRES_PASSWORD: umami_password
            POSTGRES_DB: umami
  service:
    main:
      controller: main
      ports:
        http:
          port: 3000
          protocol: HTTP
    db:
      controller: db
      ports:
        postgresql:
          port: 5432
          protocol: TCP
  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: &host umami.192.168.86.224.nip.io
          paths:
            - path: /
              pathType: Prefix
              service:
                name: main
                port: http
      tls:
        - hosts:
            - *host
          secretName: umami-tls-certificate
  persistence:
    db-data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      storageClass: standard-rwo
      advancedMounts:
        db:
          db:
            - path: /var/lib/postgresql/data
